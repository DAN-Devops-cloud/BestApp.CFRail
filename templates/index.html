<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استخراج آدرس Cloudflare Tunnel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: #6c757d;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.2);
        }

        .secondary-btn:hover {
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .url-container {
            margin-top: 20px;
        }

        .url-item {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .url-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .url-item.panel {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .url-item.panel .label {
            color: #667eea;
        }

        .url-item.tunnel {
            border-color: #764ba2;
            background: #faf4ff;
        }

        .url-item.tunnel .label {
            color: #764ba2;
        }

        .url-content {
            flex: 1;
            min-width: 0;
        }

        .label {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-text {
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 12px;
            word-break: break-all;
            color: #333;
            line-height: 1.5;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .copy-btn, .open-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 600;
        }

        .open-btn {
            background: #764ba2;
        }

        .copy-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .open-btn:hover {
            background: #653d8a;
            transform: translateY(-1px);
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 12px;
            color: #0c5aa0;
            line-height: 1.6;
        }

        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .url-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 استخراج آدرس Tunnel</h1>
            <p class="subtitle">دکمه زیر را بزنید تا URL‌های Cloudflare Tunnel استخراج شوند</p>
        </header>

        <div class="button-group">
            <button id="extractBtn" onclick="extractUrls()">
                ✨ استخراج آدرس‌ها
            </button>
            <button class="secondary-btn" id="refreshBtn" onclick="extractUrls()">
                🔄 بازخوانی
            </button>
            <button class="secondary-btn" onclick="toggleLogs()">
                📋 نمایش لاگ
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>در حال جستجو...</p>
        </div>

        <div class="results" id="results">
            <div id="alert" class="alert"></div>
            <div id="urlsContainer" class="url-container"></div>
            <div class="info-box" id="infoBox"></div>
            <div id="timestamp" class="timestamp"></div>
        </div>

        <div id="logsContainer" style="display: none; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
            <h3 style="margin-bottom: 10px; color: #333;">لاگ‌های خام:</h3>
            <pre id="logsContent" style="background: #333; color: #0f0; padding: 10px; border-radius: 5px; font-size: 11px; max-height: 300px; overflow-y: auto; font-family: 'Courier New';">Loading...</pre>
        </div>
    </div>

    <script>
        async function extractUrls() {
            const btn = document.getElementById("extractBtn");
            const loading = document.getElementById("loading");
            const results = document.getElementById("results");
            const alert = document.getElementById("alert");
            const container = document.getElementById("urlsContainer");
            const infoBox = document.getElementById("infoBox");
            const timestamp = document.getElementById("timestamp");

            btn.disabled = true;
            loading.style.display = "block";
            results.style.display = "none";
            container.innerHTML = "";
            alert.classList.remove("show", "success", "warning", "error");

            try {
                const response = await fetch("/api/extract-urls");
                const data = await response.json();

                loading.style.display = "none";
                results.style.display = "block";

                // نمایش پیام
                alert.textContent = data.message;
                alert.className = `alert show ${data.status}`;

                if (data.urls && data.urls.length > 0) {
                    // برچسب‌های صحیح برای پورت‌ها
                    const urlLabels = {
                        0: "🎛️ پنل 3x-UI (localhost:2053)",
                        1: "📡 Inbound (localhost:2097)",
                        2: "🔐 Tunnel (localhost:2098)"
                    };

                    data.urls.forEach((url, index) => {
                        const urlBox = document.createElement("div");
                        const isPanel = index === 0;
                        urlBox.className = `url-item ${isPanel ? 'panel' : 'tunnel'}`;

                        const labelText = urlLabels[index] || `تانل ${index + 1}`;

                        urlBox.innerHTML = `
                            <div class="url-content">
                                <span class="label">${labelText}</span>
                                <div class="url-text">${url}</div>
                            </div>
                            <div class="action-buttons">
                                <button class="copy-btn" onclick="copyToClipboard('${url}', this)">
                                    📋 کپی
                                </button>
                                <button class="open-btn" onclick="openURL('${url}')">
                                    🔗 باز کردن
                                </button>
                            </div>
                        `;
                        container.appendChild(urlBox);
                    });

                    // نمایش اطلاعات اضافی
                    infoBox.innerHTML = `
                        <strong>💾 اطلاعات:</strong><br>
                        تعداد آدرس: ${data.urls.length}<br>
                        حجم لاگ: ${(data.log_size / 1024).toFixed(2)} KB<br>
                        <strong>📌 نکته:</strong> وب‌سرور (8080) بدون تانل، مستقیماً از Railway domain قابل دسترسی است.
                    `;
                    
                    if (data.timestamp) {
                        timestamp.textContent = `⏱️ آخرین بروزرسانی: ${new Date(data.timestamp).toLocaleString('fa-IR')}`;
                    }
                }
            } catch (error) {
                loading.style.display = "none";
                results.style.display = "block";
                alert.textContent = `❌ خطا در اتصال: ${error.message}`;
                alert.className = "alert show error";
            } finally {
                btn.disabled = false;
            }
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "✅ کپی شد!";
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        function openURL(url) {
            window.open(url, '_blank');
        }

        function toggleLogs() {
            const logsContainer = document.getElementById("logsContainer");
            if (logsContainer.style.display === "none") {
                logsContainer.style.display = "block";
                fetchLogs();
            } else {
                logsContainer.style.display = "none";
            }
        }

        async function fetchLogs() {
            try {
                const response = await fetch("/api/logs");
                const data = await response.json();
                document.getElementById("logsContent").textContent = data.logs;
            } catch (error) {
                document.getElementById("logsContent").textContent = `خطا: ${error.message}`;
            }
        }

        // استخراج خودکار هنگام بارگیری
        window.addEventListener("load", () => {
            console.log("✅ صفحه بارگیری شد");
        });
    </script>
</body>
</html>
